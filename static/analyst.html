<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Аналитик · BCC Shield</title>
  <link rel="stylesheet" href="/static/css/fonts.css">
  <script src="/static/vendor/vis-network-9.1.9.min.js"></script>
  <link rel="stylesheet" href="/static/css/app.css">
  <link rel="stylesheet" href="/static/css/tailwind.css">
  <style>
    body { height: 100vh; overflow: hidden; }
    .metric { padding: 14px 18px; border-right: 1px solid var(--line); min-width: 0; }
    .metric:last-child { border-right: 0; }
    .metric .v { font-size: 22px; font-weight: 600; letter-spacing: -0.02em; margin-top: 4px; white-space: nowrap; }
    .panel-h { height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid var(--line); flex: none; }
    .feed-row { padding: 10px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
    .feed-row:hover, .feed-row.sel { background: var(--surface-2); }
    #graph { position: absolute; inset: 0; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 99px; margin-right: 5px; vertical-align: -1px; }
    input[type=range] { accent-color: var(--accent); }
    .kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 12.5px; }
    .kv dt { color: var(--muted); } .kv dd { margin: 0; text-align: right; font-variant-numeric: tabular-nums; }
    div.vis-tooltip { background: var(--surface-2) !important; color: var(--text) !important; border: 1px solid var(--line-strong) !important;
      font-family: Geist, sans-serif !important; font-size: 12px !important; border-radius: 8px !important; padding: 6px 9px !important; white-space: pre-line !important; }
    .hdr-short { display: none; }
    @media (max-width: 1100px) { .hdr-long, .hdr-cfg { display: none; } .hdr-short { display: inline; } }
    /* 8 metrics in one row need ~1300px; below that two rows of 4, so labels are not cut ("ОСТАНОВЛЕН…") */
    @media (max-width: 1320px) { .metrics { grid-template-columns: repeat(4, minmax(0, 1fr)) !important; }
      .metric:nth-child(-n+4) { border-bottom: 1px solid var(--line); } }
    @media (max-width: 1180px) { .layout { grid-template-columns: 300px 1fr 340px !important; } .metric .v { font-size: 18px; } }
    @media (max-width: 900px) { body { overflow: auto; height: auto; } .layout { grid-template-columns: 1fr !important; height: auto !important; } .layout > section { height: 70vh; }
      .metrics { grid-template-columns: repeat(2, 1fr) !important; } }
  </style>
</head>
<body class="flex flex-col">
  <header class="min-h-[52px] py-2 flex-none flex flex-wrap items-center justify-between px-4 border-b hair gap-x-3 gap-y-2">
    <div class="flex items-center gap-2.5 min-w-0 flex-none">
      <a href="/" class="app-icon sm"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 2.5 4.5 5.3v6.1c0 4.6 3.1 8.6 7.5 10.1 4.4-1.5 7.5-5.5 7.5-10.1V5.3L12 2.5Z" fill="#1c1c1a"/><path d="M12 5.2v14.1c3.1-1.3 5.1-4.4 5.1-7.9V7.1L12 5.2Z" fill="#2fd27a"/></svg></a>
      <span class="text-[14px] font-medium whitespace-nowrap">BCC Shield (демо)</span><span class="faint">/</span><span class="text-[14px] muted whitespace-nowrap">Антифрод-аналитик</span>
      <span id="ws-dot" class="w-1.5 h-1.5 rounded-full bg-[color:var(--faint)] ml-1"></span>
    </div>
    <div class="flex items-center gap-2 flex-wrap justify-end">
      <span id="cfg" class="hdr-cfg flex gap-1.5 whitespace-nowrap"></span>
      <button class="btn btn-sm" onclick="fastForward(this)">⏩ Промотать охлаждение</button>
      <button class="btn btn-sm" onclick="phoneCallDemo(this)" title="Телефон Сауле сообщает приложению банка (CallKit / Android): входящий с незнакомого номера идёт 12 минут. Без записи разговора">📱 <span class="hdr-long">Звонок с незнакомого номера</span><span class="hdr-short">Звонок</span></button>
      <button class="btn btn-sm" onclick="telecomSignal(this)" title="Пилот Нацбанка «Телеком Антифрод»: оператор сообщает банку о подозрительном звонке">📶 <span class="hdr-long">Сигнал оператора связи</span><span class="hdr-short">Оператор</span></button>
      <button class="btn btn-sm" onclick="simulateSignal(this)">📡 <span class="hdr-long">Входящий сигнал Антифрод-центра</span><span class="hdr-short">Сигнал АФЦ</span></button>
      <button class="btn btn-sm btn-ghost" onclick="resetDemo(this)">Сбросить демо</button>
    </div>
  </header>

  <div class="metrics grid flex-none border-b hair" style="grid-template-columns: repeat(8, minmax(0, 1fr))" id="metrics"></div>

  <main class="layout flex-1 grid min-h-0" style="grid-template-columns: 340px 1fr 400px">
    <section class="flex flex-col min-h-0 border-r hair">
      <div class="panel-h"><span class="label">Активные звонки</span><span class="text-[11px] faint" id="calls-n"></span></div>
      <div id="calls" class="flex-none max-h-[42%] scroll"></div>
      <div class="panel-h border-t hair"><span class="label">Лента операций · live</span><span class="text-[11px] faint">клик → разбор</span></div>
      <div id="feed" class="flex-1 scroll min-h-0"></div>
    </section>

    <section class="flex flex-col min-h-0 relative">
      <div class="panel-h gap-3">
        <div class="flex items-center gap-3 min-w-0">
          <span class="label whitespace-nowrap">Граф переводов</span>
          <label class="flex items-center gap-2 text-[12px] muted whitespace-nowrap">риск &gt; <span id="thr-v" class="num text-[color:var(--text)] w-5">40</span>
            <input id="thr" type="range" min="0" max="90" step="10" value="40" class="w-24"></label>
        </div>
        <div class="flex items-center gap-1.5">
          <button class="btn btn-sm" onclick="highlightFromVictim()">Подсветить цепочку от жертвы</button>
          <button class="btn btn-sm btn-ghost" onclick="clearHighlight()">Сбросить</button>
        </div>
      </div>
      <div class="flex-1 relative min-h-0"><div id="graph"></div>
        <div id="graph-loading" class="absolute inset-0 grid place-items-center text-[13px] muted">Строим граф…</div>
        <div class="legend absolute left-3 bottom-3 card px-3 py-2 text-[11.5px] muted flex flex-wrap gap-x-3 gap-y-1 max-w-[560px]">
          <span><i style="background:var(--danger)"></i>дроппер (≥60)</span><span><i style="background:var(--warn)"></i>подозрительный</span>
          <span><i style="background:#3f8f63"></i>счёт БЦК</span><span><i style="background:#77756e;border-radius:2px"></i>карта другого банка</span>
          <span><i style="background:#c9a7ff"></i>клиент демо</span><span><span style="color:var(--danger)">╌╌</span> отклонённый перевод</span>
        </div>
        <div id="graph-stats" class="absolute right-3 bottom-3 text-[11px] faint mono"></div>
      </div>
    </section>

    <section class="flex flex-col min-h-0 border-l hair">
      <div class="panel-h"><span class="label" id="detail-h">Разбор</span><span id="detail-x"></span></div>
      <div id="detail" class="flex-1 scroll min-h-0 p-4"></div>
      <div class="panel-h border-t hair"><span class="label">Журнал Антифрод-центра</span><span class="text-[11px] faint">заглушка API</span></div>
      <div id="journal" class="h-[190px] flex-none scroll"></div>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/analyst.js"></script>
</body>
</html>
